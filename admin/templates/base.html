<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Photo studio{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><a href="/" style="color:inherit">📸 Photo studio</a></div>
  <nav>
    <a href="/" class="{{ 'active' if section == 'catalog' }}">Catalog</a>
    <a href="/settings" class="{{ 'active' if section == 'settings' }}">Settings</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<div id="toast"></div>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
